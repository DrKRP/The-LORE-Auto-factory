<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LORE Player</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
  --tutor: #ffffff; --learner: #1f4e79; --learner-ink: #ffffff; --accent: #1f4e79;
  --ok: #2e7d4f; --bad: #b3412e; --warn: #9a6b00; --chip: #efede6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514; --surface: #1f1f1d; --ink: #ecebe6; --muted: #a09e96; --line: #33322f;
    --tutor: #232321; --learner: #3d6fa0; --learner-ink: #ffffff; --accent: #7fb0e0;
    --ok: #6cc290; --bad: #e88a78; --warn: #e0b45c; --chip: #2a2a27;
  }
}
:root[data-theme="dark"] {
  --bg: #151514; --surface: #1f1f1d; --ink: #ecebe6; --muted: #a09e96; --line: #33322f;
  --tutor: #232321; --learner: #3d6fa0; --learner-ink: #ffffff; --accent: #7fb0e0;
  --ok: #6cc290; --bad: #e88a78; --warn: #e0b45c; --chip: #2a2a27;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar h1 { font-size: 16px; margin: 0; flex: 1; min-width: 140px; }
.bar select, .bar button, .bar label { font: inherit; font-size: 14px; }
select, button { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.progress { height: 3px; background: var(--line); }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.seg { max-width: 760px; margin: 0 auto; padding: 0 16px 8px; font-size: 13px; color: var(--muted); }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 160px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; margin: 6px 0; overflow-wrap: anywhere; }
.tutor { background: var(--tutor); border: 1px solid var(--line); border-top-left-radius: 4px; }
.learner { background: var(--learner); color: var(--learner-ink); margin-left: auto; border-top-right-radius: 4px; }
.meta { font-size: 12px; color: var(--muted); margin: 14px 0 2px; }
.device { border-style: dashed; }
.flag { color: var(--warn); font-weight: 600; }
.sure { border-left: 3px solid var(--warn); }
sup a { color: var(--accent); text-decoration: none; font-weight: 600; margin-left: 2px; }
.ids { display: none; font: 11px ui-monospace, monospace; color: var(--muted); }
body.debug .ids { display: block; }
.choices { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); }
.choices .inner { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: grid; gap: 8px; }
.choices button { text-align: left; padding: 10px 14px; border-radius: 10px; }
.choices button:hover, .choices button:focus-visible { border-color: var(--accent); outline: none; }
.choices .ask { font-size: 13px; color: var(--muted); }
.row { display: flex; gap: 8px; }
.row button { flex: 1; text-align: center; }
.empty { text-align: center; color: var(--muted); padding: 60px 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 16px 0; }
.panel h2 { font-size: 16px; margin: 0 0 8px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat { background: var(--chip); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-size: 20px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; cursor: pointer; }
.card .a { display: none; margin-top: 6px; color: var(--muted); }
.card.open .a { display: block; }
.days { font-size: 12px; color: var(--muted); }
dialog { max-width: min(560px, 92vw); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
dialog a { color: var(--accent); overflow-wrap: anywhere; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 24px; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title">LORE Player</h1>
    <select id="picker" aria-label="Module"><option value="">Choose a module…</option></select>
    <button id="back" title="Undo last choice">Undo</button>
    <button id="restart">Restart</button>
    <label><input type="checkbox" id="debug"> IDs</label>
  </div>
  <div class="progress"><div id="prog"></div></div>
  <div class="seg" id="seg"></div>
</header>
<main id="chat">
  <div class="empty" id="empty">
    <p>Pick a module above, or open a module JSON file.</p>
    <p class="days">Serve the repository root (<code>python3 -m http.server</code>) and open <code>/player/</code> to list published modules. Add <code>?m=../workshop/&lt;subject&gt;/&lt;slug&gt;/module.json</code> to preview a draft.</p>
    <div class="drop"><input type="file" id="file" accept=".json,application/json"></div>
  </div>
</main>
<div class="choices" id="choices" hidden><div class="inner" id="choiceInner"></div></div>
<dialog id="ref"><div id="refBody"></div><form method="dialog"><button>Close</button></form></dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let M = null, S = null;

function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; } }

function esc(t) { return t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function md(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>"); }

function cite(claims) {
  if (!claims || !claims.length) return "";
  const nums = [];
  for (const c of claims) for (const r of (M.claims[c] || {}).refs || []) if (!nums.includes(r)) nums.push(r);
  return " <sup>" + claims.map((c) => `<a href="#" data-claim="${esc(c)}">[${((M.claims[c] || {}).refs || ["?"]).join(",")}]</a>`).join("") + "</sup>";
}

function bubble(cls, html, extra) {
  const d = document.createElement("div");
  d.className = "msg " + cls + (extra ? " " + extra : "");
  d.innerHTML = html;
  $("chat").appendChild(d);
  return d;
}

function sayNode(id, sure) {
  const n = M.nodes[id];
  const seg = M.segments.find((s) => s.id === n.segment);
  if (seg) {
    $("seg").textContent = `${$("seg").dataset.prov || ""}${seg.id} · ${seg.title}`;
    const i = M.segments.indexOf(seg);
    $("prog").style.width = `${Math.round(((i + (n.end ? 1 : 0.5)) / M.segments.length) * 100)}%`;
  }
  const meta = document.createElement("div");
  meta.className = "ids";
  meta.textContent = `${id} · ${n.role}${n.objectives ? " · " + n.objectives.join(",") : ""}`;
  $("chat").appendChild(meta);
  const msgs = [...(n.say || [])];
  if (sure && n.sure_note) msgs.push(Object.assign({ _sure: true }, n.sure_note));
  for (const m of msgs) {
    const flag = m.flag === "unverified" ? '<span class="flag">⚠ Unverified · </span>' : "";
    bubble("tutor", flag + md(m.text) + cite(m.claims) +
      (m.claims && m.claims.length ? `<span class="ids">${m.claims.join(" ")}</span>` : ""),
      (m.device ? "device" : "") + (m._sure ? " sure" : ""));
  }
}

function render() {
  const id = S.at, n = M.nodes[id];
  const box = $("choiceInner");
  box.innerHTML = "";
  $("choices").hidden = false;
  if (n.end) { $("choices").hidden = true; summary(); return; }
  if (S.pending) {
    const p = document.createElement("div");
    p.className = "ask";
    p.textContent = "How sure are you?";
    box.appendChild(p);
    const row = document.createElement("div");
    row.className = "row";
    for (const [lab, sure] of [["Sure", true], ["Guessing", false]]) {
      const b = document.createElement("button");
      b.textContent = lab;
      b.onclick = () => commit(S.pending, sure);
      row.appendChild(b);
    }
    box.appendChild(row);
    return;
  }
  n.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.textContent = c.label;
    b.onclick = () => n.ask_confidence && ["correct", "partial", "trap"].includes(c.kind) ? (S.pending = i, render()) : commit(i, null);
    box.appendChild(b);
  });
}

function commit(i, sure) {
  const n = M.nodes[S.at], c = n.choices[i];
  S.hist.push({ at: S.at, choice: i, sure, t: Date.now() });
  S.pending = null;
  bubble("learner", esc(c.label) + (sure === null ? "" : ` <span class="days">· ${sure ? "Sure" : "Guessing"}</span>`));
  S.at = c.next;
  if (!M.nodes[S.at]) { bubble("tutor", `Broken link: ${esc(S.at)}`); return; }
  sayNode(S.at, sure === true && c.kind !== "correct");
  save();
  render();
  window.scrollTo(0, document.body.scrollHeight);
}

// Report engine: mirrors render_report() in scripts/factory.py (rules: reference/report.md). Keep in sync.
function computeReport() {
  const nodes = M.nodes, traps = Object.fromEntries((M.traps || []).map((t) => [t.id, t]));
  const steps = S.hist.map((h) => {
    const n = nodes[h.at], c = n.choices[h.choice];
    return { node: h.at, role: n.role, kind: c.kind, trap: c.trap || null, sure: h.sure ?? null,
      objectives: n.objectives || [], offers: n.choices.filter((x) => x.kind === "trap").map((x) => x.trap) };
  });
  const first = [], seen = new Set(), helped = new Set();
  for (const s of steps) {
    if (s.kind === "help") helped.add(s.node);
    if (s.role === "probe" && ["correct", "partial", "trap"].includes(s.kind) && !seen.has(s.node)) {
      seen.add(s.node);
      s.hinted = helped.has(s.node);
      s.cold = !nodes[s.node].choices.some((c) => c.kind === "help");
      first.push(s);
    }
  }
  const trapStatus = {};
  for (const tid of Object.keys(traps)) {
    const enc = first.filter((s) => s.offers.includes(tid));
    if (!enc.length) { trapStatus[tid] = "not_met"; continue; }
    const fell = enc.map((s, i) => (s.trap === tid ? i : -1)).filter((i) => i >= 0);
    if (!fell.length) trapStatus[tid] = "avoided";
    else if (enc.slice(fell[fell.length - 1] + 1).some((s) => s.kind === "correct") && enc[enc.length - 1].kind === "correct") trapStatus[tid] = "fell_recovered";
    else trapStatus[tid] = "fell_open";
  }
  const levels = {};
  for (const o of M.objectives || []) {
    const ans = first.filter((s) => s.objectives.includes(o.id));
    const lane = steps.some((s) => s.kind === "skip" && s.objectives.includes(o.id));
    const openTrap = Object.entries(traps).some(([t, d]) => trapStatus[t] === "fell_open" && (d.objectives || []).includes(o.id));
    if (!ans.length && !lane) { levels[o.id] = "unseen"; continue; }
    const wrong = ans.filter((s) => s.kind !== "correct").length;
    const sureWrong = ans.filter((s) => s.sure === true && s.kind !== "correct").length;
    const guessed = ans.filter((s) => s.sure === false).length;
    if (openTrap || (ans.length && wrong * 2 >= ans.length && ans[ans.length - 1].kind !== "correct")) levels[o.id] = "gap";
    else if ((wrong === 0 && sureWrong === 0 && guessed * 2 < Math.max(1, ans.length)) || (lane && wrong === 0)) levels[o.id] = "secure";
    else levels[o.id] = "shaky";
  }
  const fallen = Object.keys(trapStatus).filter((t) => trapStatus[t].startsWith("fell"));
  const byType = {};
  for (const t of fallen) (byType[traps[t].error_type] = byType[traps[t].error_type] || []).push(t);
  const conf = first.filter((s) => s.sure !== null);
  const sureWrong = conf.filter((s) => s.sure && s.kind !== "correct").length;
  const guessRight = conf.filter((s) => s.sure === false && s.kind === "correct").length;
  let calibration = null;
  if (conf.length >= 3) calibration = sureWrong >= 2 ? "overconfident" : (guessRight >= 3 && sureWrong === 0 ? "underconfident" : (conf.some((s) => s.sure === true) ? "calibrated" : null));
  const hints = steps.filter((s) => s.kind === "help" || s.kind === "agency").length;
  const objsOf = (pred) => new Set(first.filter(pred).flatMap((s) => s.objectives));
  const coldRight = objsOf((s) => s.cold && s.kind === "correct"), plainRight = objsOf((s) => !s.hinted && s.kind === "correct");
  const hintedOnly = [...objsOf((s) => s.hinted && s.kind === "correct")].filter((o) => !coldRight.has(o) && !plainRight.has(o)).sort();
  const help = hints >= 3 ? "hints_heavy" : (hintedOnly.length ? "hinted_only" : (hints === 0 && fallen.length ? "hints_none" : null));
  const confident = Object.keys(traps).filter((t) => first.some((s) => s.trap === t && s.sure === true));
  const cold = first.filter((s) => s.cold);
  const core = (M.objectives || []).filter((o) => o.core).map((o) => o.id);
  const gaps = core.filter((o) => levels[o] === "gap");
  const shaky = Object.keys(levels).filter((o) => levels[o] === "shaky");
  const headline = !gaps.length && shaky.length <= 1 ? "strong" : (gaps.length * 3 >= Math.max(1, core.length) ? "weak" : "mixed");
  const rank = { gap: 1, shaky: 2 };
  const confObj = new Set(confident.flatMap((t) => traps[t].objectives || []));
  const cr = (i) => (confObj.has(M.cards[i].objective) ? 0 : (rank[levels[M.cards[i].objective]] ?? 3));
  const cardOrder = (M.cards || []).map((c, i) => i).sort((a, b) => cr(a) - cr(b));
  return { headline, objectives: levels, traps: trapStatus, error_profile: byType, calibration, sure_wrong: sureWrong,
    guess_right: guessRight, hints, help, fast_lane: steps.some((s) => s.kind === "skip"), confident_errors: confident,
    hinted_only: hintedOnly, cold_right: cold.filter((s) => s.kind === "correct").length, cold_total: cold.length, card_order: cardOrder, steps };
}

function rtext(...keys) { let x = M.report || {}; for (const k of keys) x = (x || {})[k]; return x && x.text ? x : null; }

function summary() {
  const R = computeReport();
  const msg = (m) => (m ? `<p>${md(m.text)}${cite(m.claims)}</p>` : "");
  const LV = { secure: "Secure", shaky: "Shaky", gap: "Gap", unseen: "Not seen" };
  const TS = { avoided: "Avoided", fell_recovered: "Fell, then fixed", fell_open: "Fell, still open", not_met: "Not met" };
  const p = document.createElement("div");
  p.className = "panel";
  const firstAns = R.steps.filter((s, i, a) => s.role === "probe" && ["correct", "partial", "trap"].includes(s.kind) && a.findIndex((x) => x.node === s.node) === i);
  p.innerHTML = `<h2>Your report</h2>` + msg(rtext("headline", R.headline)) + `<div class="stats">
    <div class="stat"><b>${firstAns.filter((s) => s.kind === "correct").length}/${firstAns.length}</b>right first time</div>
    <div class="stat"><b>${R.sure_wrong}</b>sure but wrong</div>
    <div class="stat"><b>${R.guess_right}</b>guessed and right</div>
    <div class="stat"><b>${R.hints}</b>hints used</div>
    <div class="stat"><b>${R.cold_right}/${R.cold_total}</b>right with no hint available</div></div>`;
  $("chat").appendChild(p);
  const o = document.createElement("div");
  o.className = "panel";
  o.innerHTML = "<h2>What you know</h2>" + (M.objectives || []).map((ob) => {
    const lv = R.objectives[ob.id];
    return `<div class="card open"><div><b>${LV[lv]}</b> · ${esc(ob.text)}</div>${lv in LV && lv !== "unseen" ? `<div class="a">${msg(rtext("objectives", ob.id, lv))}</div>` : ""}</div>`;
  }).join("");
  $("chat").appendChild(o);
  const t = document.createElement("div");
  t.className = "panel";
  const fallen = (M.traps || []).filter((tr) => R.traps[tr.id].startsWith("fell"))
    .sort((a, b) => R.confident_errors.includes(b.id) - R.confident_errors.includes(a.id));
  t.innerHTML = "<h2>Traps</h2>" + (fallen.length ? fallen.map((tr) =>
    `<div class="card open"><div><b>${TS[R.traps[tr.id]]}</b>${R.confident_errors.includes(tr.id) ? ' <span class="flag">· you were sure</span>' : ""} · ${esc(tr.trap)}</div><div class="a">${msg(rtext("traps", tr.id, R.traps[tr.id]))}</div></div>`).join("") : "<p>You fell into none of the traps you met.</p>") +
    `<p class="days">Avoided: ${(M.traps || []).filter((tr) => R.traps[tr.id] === "avoided").length} · Not met on your path: ${(M.traps || []).filter((tr) => R.traps[tr.id] === "not_met").length}</p>` +
    Object.entries(R.error_profile).filter(([, ts]) => ts.length >= 2).map(([et]) => msg(rtext("error_types", et))).join("") +
    (R.calibration ? msg(rtext("calibration", R.calibration)) : "") +
    (R.help ? msg(rtext("help", R.help)) : "") +
    (R.fast_lane ? msg(rtext("pace", "fast_lane")) : "") +
    msg(rtext("next_steps", Object.values(R.objectives).some((v) => v === "gap" || v === "shaky") ? "gap" : "clear"));
  $("chat").appendChild(t);
  if (M.cards && M.cards.length) {
    const c = document.createElement("div");
    c.className = "panel";
    c.innerHTML = `<h2>Review cards</h2><p class="days">Weakest first. Tap to reveal. Come back on days ${esc((M.cards[0].schedule_days || []).join(", "))}.</p>` +
      R.card_order.map((i) => { const k = M.cards[i]; return `<div class="card"><div>${md(k.q)} <span class="days">${esc(LV[R.objectives[k.objective]] || "")}</span></div><div class="a">${md(k.a)}${cite(k.claims)}</div></div>`; }).join("");
    c.addEventListener("click", (e) => { const k = e.target.closest(".card"); if (k && !e.target.closest("a")) k.classList.toggle("open"); });
    $("chat").appendChild(c);
  }
  const r = document.createElement("div");
  r.className = "panel";
  r.innerHTML = "<h2>References</h2><ol>" + Object.entries(M.references).map(([n, ref]) =>
    `<li value="${esc(n)}">${esc(ref.title)} <a href="${esc(ref.url)}" target="_blank" rel="noopener">link</a> <span class="days">tier ${ref.tier ?? "?"}</span></li>`).join("") +
    `</ol><div class="row"><button id="export">Download session record</button><button id="copyrec">Copy session record</button></div>`;
  $("chat").appendChild(r);
  const record = () => {
    const { steps, ...computed } = R;
    return { module: M.id, version: M.version, started: S.hist.length ? new Date(S.hist[0].t || Date.now()).toISOString() : null,
      finished: new Date().toISOString(), path: S.hist.map((h) => ({ node: h.at, choice: h.choice, sure: h.sure ?? null, t: h.t || null })), report: computed };
  };
  $("copyrec").onclick = async (e) => {
    try { await navigator.clipboard.writeText(JSON.stringify(record(), null, 2)); e.target.textContent = "Copied"; }
    catch (err) { e.target.textContent = "Copy blocked: use Download"; }
  };
  if ($("export")) $("export").onclick = () => {
    const { steps, ...computed } = R;
    const rec = { module: M.id, version: M.version, started: S.hist.length ? new Date(S.hist[0].t || Date.now()).toISOString() : null,
      finished: new Date().toISOString(), path: S.hist.map((h) => ({ node: h.at, choice: h.choice, sure: h.sure ?? null, t: h.t || null })), report: computed };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(rec, null, 2)], { type: "application/json" }));
    a.download = `${M.id.replace("/", "__")}-session.json`;
    a.click();
  };
}

function save() { store("lore:" + M.id, { hist: S.hist, at: S.at }); }

function replay() {
  $("chat").innerHTML = "";
  const start = M.start;
  sayNode(start, false);
  let at = start;
  for (const h of S.hist) {
    const c = M.nodes[at].choices[h.choice];
    bubble("learner", esc(c.label) + (h.sure === null || h.sure === undefined ? "" : ` <span class="days">· ${h.sure ? "Sure" : "Guessing"}</span>`));
    at = c.next;
    sayNode(at, h.sure === true && c.kind !== "correct");
  }
  S.at = at;
  render();
}

function load(mod) {
  M = mod;
  $("title").textContent = M.title + (M.status && M.status !== "published" ? ` (${M.status})` : "");
  document.title = M.title + " · LORE";
  $("empty").hidden = true;
  $("seg").dataset.prov = M.provenance === "model-knowledge" ? "Written from expert knowledge and cross-checked; not yet source-verified. " : "";
  const saved = store("lore:" + M.id);
  S = { at: M.start, hist: (saved && saved.hist) || [], pending: null };
  try { replay(); } catch (e) { S.hist = []; replay(); }
}

$("back").onclick = () => { if (!M || !S.hist.length) return; S.hist.pop(); S.pending = null; save(); replay(); };
$("restart").onclick = () => { if (!M) return; S.hist = []; S.pending = null; save(); replay(); };
$("debug").onchange = (e) => document.body.classList.toggle("debug", e.target.checked);
$("file").onchange = async (e) => { const f = e.target.files[0]; if (f) load(JSON.parse(await f.text())); };
$("chat").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-claim]");
  if (!a) return;
  e.preventDefault();
  const c = M.claims[a.dataset.claim];
  if (!c) return;
  $("refBody").innerHTML = `<p>${md(c.text)}</p>` + (c.status === "unverified" ? '<p class="flag">⚠ Unverified: single tier-2 source.</p>' : "") +
    "<ol>" + c.refs.map((r) => { const ref = M.references[r] || {}; return `<li value="${esc(r)}">${esc(ref.title || "?")} <a href="${esc(ref.url || "#")}" target="_blank" rel="noopener">source</a></li>`; }).join("") + "</ol>";
  $("ref").showModal();
});
$("picker").onchange = async (e) => { if (e.target.value) load(await (await fetch("../modules/" + e.target.value)).json()); };

(async () => {
  const q = new URLSearchParams(location.search).get("m");
  try {
    const idx = await (await fetch("../modules/index.json")).json();
    for (const m of idx.modules) {
      const o = document.createElement("option");
      o.value = m.path;
      o.textContent = `${m.subject} · ${m.title}`;
      $("picker").appendChild(o);
    }
  } catch (e) { $("picker").hidden = true; }
  if (window.LORE_MODULE) { $("picker").hidden = true; load(window.LORE_MODULE); return; }
  if (q) { try { load(await (await fetch(q)).json()); } catch (e) { bubble("tutor", "Could not load " + esc(q)); } }
})();
</script>
</body>
</html>
